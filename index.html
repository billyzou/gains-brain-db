  document.getElementById("theme-color").content = "#121212"; } } catch {}</script>

<title>Gains Brain</title>
<style>
  :root {
    --bg: #f4f4f1; --card: #fff; --text: #1b1b1a; --muted: #77756f; --line: #e3e1db;
    --accent: #2f6fde; --accent-text: #fff; --danger: #c8412f; --chip: #eae8e2;
    --done: #2e9d5b; --done-soft: #dff1e5;
    --s1: #2a78d6; --s2: #eb6834; /* chart series: lifting, Muay Thai */
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212; --card: #1d1d1c; --text: #ecebe7; --muted: #9a988f; --line: #2e2d2b;
    --accent: #5b8ff0; --accent-text: #0b0b0b; --danger: #ef6b58; --chip: #2a2a28;
    --done: #4cc47e; --done-soft: #1d3426;
    --s1: #3987e5; --s2: #d95926;
  }
  #theme svg { width: 16px; height: 16px; vertical-align: -2px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* App shell: header and tab bar are rows of a full-screen frame and only <main> scrolls.
     The iOS Home Screen app only gets the full screen height when the document is taller than
     the screen, so html is made a status bar taller; nothing lives in that extra space. */
  html { background: var(--bg); min-height: calc(100% + env(safe-area-inset-top)); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  header {
    flex: none; background: var(--bg);
    padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
  }
  .row { display: flex; align-items: center; gap: 8px; }
  h1 { flex: 1; font-size: 22px; margin: 0; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .logo { width: 48px; height: 42px; flex: none; margin: -4px 0; }
  .logo .bar { fill: var(--text); }
  #refresh span { display: inline-block; min-width: 1em; }
  #refresh.spin span { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: absolute; bottom: 100%; left: 16px; right: 16px; margin-bottom: 8px; padding: 10px 12px;
    border-radius: 10px; background: var(--danger); color: #fff; font-size: 14px; text-align: center; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--text); font: inherit; font-weight: 600;
    padding: 6px 14px; border-radius: 8px; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  #days { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  #days button { flex: 1; min-width: 44px; border: 0; background: var(--chip); color: var(--text);
    font: inherit; font-size: 14px; padding: 8px 0; border-radius: 10px; position: relative; }
  #days button.on { background: var(--text); color: var(--bg); font-weight: 600; }
  #days button.today::after { content: ""; position: absolute; bottom: 3px; left: 50%;
    width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
  #weeknav { margin-top: 10px; }
  #weeklabel { flex: 1; border: 0; background: none; color: var(--text); font: inherit; font-weight: 600; }
  body.cal #days, body.cal #weeknav, body.cal #edit,
  body.trends #days, body.trends #weeknav, body.trends #edit { display: none; }
  #days small { display: none; pointer-events: none; } /* dates show only in the desktop sidebar */
  main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 12px 16px 24px; display: grid; gap: 12px; align-content: start; }
  .date { font-size: 14px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .note { font-size: 20px; padding: 24px 14px; color: var(--muted); justify-content: center; min-height: 90px; }
  .name { font-weight: 650; font-size: 17px; }
  .reps { color: var(--muted); font-size: 14px; margin-left: 4px; font-weight: 400; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 12px 0 6px; }
  .total { font-size: 14px; font-weight: 600; color: var(--text); }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; width: 100%; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .weight input { text-align: center; font-size: 20px; font-weight: 600; }
  .step { flex: none; width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--chip);
    color: var(--text); font-size: 24px; }
  .sets { display: flex; gap: 8px; flex-wrap: wrap; }
  .sets select { width: 64px; padding: 10px 0; font: inherit; font-size: 18px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; text-align: center; text-align-last: center;
    -webkit-appearance: none; appearance: none; }
  .sets select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .addset { width: 48px; border: 1px dashed var(--line); background: none; color: var(--muted);
    border-radius: 10px; font-size: 20px; }
  .prev { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .check { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
    background: none; color: transparent; font-size: 20px; font-weight: 700; }
  .check.on { background: var(--done); border-color: var(--done); color: #fff; }
  .edit-only { display: none; }
  body.editing .edit-only { display: flex; }
  body.editing .view-only { display: none; }
  .tools { gap: 6px; margin-top: 10px; }
  .tools button, .btn { border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 10px; }
  .tools .del { color: var(--danger); margin-left: auto; }
  .btn.small { font-size: 13px; padding: 4px 10px; }
  .btn:disabled { opacity: .3; }
  .btn.del { color: var(--danger); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .section { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin-top: 8px; }
  .log { display: grid; gap: 12px; }
  .log .entry { gap: 12px; }
  .sub { font-size: 14px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  /* Same line height for notes (whose emoji would stretch the line) and section labels, and no
     extra gap above a label right under the date row, so the first line sits at the same spot. */
  .empty, .section { line-height: 20px; }
  main > .row + .section { margin-top: 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .dow { font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .cal-grid button { aspect-ratio: 1; border: 0; border-radius: 10px; background: none; color: var(--text);
    font: inherit; font-size: 15px; position: relative; }
  .cal-grid button.has { background: var(--done-soft); color: var(--done); font-weight: 700; }
  .cal-grid button.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cal-grid button.sel { background: var(--text); color: var(--bg); }
  .cal-grid button.future { color: var(--muted); }
  .cal-grid button.plan::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
  .month { font-size: 18px; font-weight: 650; flex: 1; text-align: center; }
  footer { flex: none; position: relative; background: var(--bg);
    border-top: 1px solid var(--line); padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); }
  footer button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit;
    font-weight: 600; padding: 10px; border-radius: 10px; }
  footer button.on { background: var(--chip); color: var(--text); }
  .cal-side { display: contents; } /* the calendar's day details; a column of its own on desktop */

  /* Trends */
  .group { font-size: 18px; font-weight: 650; margin-top: 8px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .tile .sub { font-size: 13px; }
  .tile .val { font-size: 28px; font-weight: 650; margin-top: 2px; }
  .chart { display: block; width: 100%; height: auto; margin-top: 10px; touch-action: pan-y; }
  .chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart text.end { fill: var(--text); font-weight: 600; font-size: 12px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--s1); stroke: var(--card); stroke-width: 2; }
  .chart .hl rect { fill: var(--chip); }
  .chart .hl line { stroke: var(--muted); stroke-width: 1; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .delta { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .delta.up { color: var(--done); }
  details { margin-top: 8px; font-size: 13px; }
  summary { color: var(--muted); cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 13px; padding: 6px 9px; border-radius: 8px; max-width: 240px; }

  /* Desktop: the header and tab bar become a left sidebar (display: contents lets their pieces
     sit in the page grid), and the content uses the width for columns of cards. */
  @media (min-width: 900px) {
    html { min-height: 0; }
    body { padding-top: 0; display: grid; grid-template-columns: 300px 1fr;
      grid-template-rows: auto auto auto auto 1fr; }
    header, footer { display: contents; }
    header > .row:first-child { grid-column: 1; grid-row: 1; padding: 18px 16px 14px; }
    header > .row:first-child { flex-wrap: wrap; }
    h1 { font-size: 19px; gap: 6px; flex-basis: 100%; } /* own line; the buttons go under it */
    header > .row:first-child .btn { padding: 7px 10px; }
    .logo { width: 40px; height: 35px; }
    #tabs { grid-column: 1; grid-row: 2; flex-direction: column; align-items: stretch; gap: 2px;
      padding: 0 10px 14px; border-bottom: 1px solid var(--line); }
    #tabs button { text-align: left; padding: 9px 12px; }
    #tabs button:hover:not(.on) { color: var(--text); }
    #weeknav { grid-column: 1; grid-row: 3; margin: 0; padding: 14px 12px 6px; }
    #weeklabel { font-size: 14px; }
    #days { grid-column: 1; grid-row: 4; flex-direction: column; gap: 2px; margin: 0; padding: 4px 12px; overflow: visible; }
    #days button { display: flex; justify-content: space-between; padding: 9px 12px 9px 22px; text-align: left; background: none; }
    #days button:hover:not(.on) { background: var(--chip); }
    #days button.on { background: var(--text); }
    #days button.today::after { bottom: auto; top: 50%; left: 11px; margin: -2px 0 0; }
    #days small { display: inline; font-size: 13px; opacity: .65; }
    #toast { position: fixed; left: auto; right: 24px; bottom: 24px; width: 340px; margin: 0; z-index: 10; }
    main { grid-column: 2; grid-row: 1 / -1; border-left: 1px solid var(--line);
      padding: 28px max(32px, calc((100% - 1180px) / 2)) 48px; gap: 16px; }
    body.plan main, body.trends main { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    body.plan main > :not(.card), body.plan main > .card.note, body.plan main > .card.edit-only,
    body.trends main > :not(.card), main > .card.wide { grid-column: 1 / -1; }
    main > .btn { justify-self: start; }
    .log { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    body.cal main { grid-template-columns: minmax(320px, 420px) 1fr; align-items: start; gap: 24px; }
    .cal-side { display: grid; gap: 12px; align-content: start; }
    button:not(:disabled), select { cursor: pointer; }
  }
</style>
</head>

<script>
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const iso = (d) => d.toLocaleDateString("en-CA"); // YYYY-MM-DD in local time
const parse = (s) => new Date(s + "T00:00:00");
const fmt = (s, o) => parse(s).toLocaleDateString(undefined, o);
const today = new Date(); today.setHours(0, 0, 0, 0);
const todayStr = iso(today);
let data, dayIdx = today.getDay(), weekOffset = 0, view = "plan", editing = false, saveTimer;
let sched = { moves: [], cancels: [] }, schedErr = "";
let calMonth = new Date(today.getFullYear(), today.getMonth(), 1), calSel = todayStr;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (msg) => { $("#toast").textContent = msg; $("#toast").hidden = !msg; }; // "" hides it
// A date's log: what you checked off, plus Muay Thai sessions counted automatically.
const logFor = (date) => {
  const entries = data.log.filter((e) => e.date === date);
  return entries.concat(autoEntries(date).filter((a) => !entries.some((e) => e.name === a.name)));
};
const isAuto = (name) => /muay thai/i.test(name);
const skipped = (date, name) => (data.skips[date] || []).includes(name);
// Muay Thai sessions planned on a date count as done once the day arrives, unless unchecked.
function autoEntries(date) {
  if (date > todayStr || date < START) return [];
  return plansFor(date, false).map(({ t }) => data.days[t].note)
    .filter((note) => note && isAuto(note) && !skipped(date, note))
    .map((name) => ({ date, name, auto: true }));
}
// Date of the selected day tab within the current Sun–Sat week.
// Date of the selected day tab within the viewed Sun–Sat week (weekOffset 0 = this week).
const weekStart = () => { const d = new Date(today); d.setDate(d.getDate() - today.getDay() + 7 * weekOffset); return d; };
const curDate = () => { const d = weekStart(); d.setDate(d.getDate() + dayIdx); return iso(d); };
const flip = (w) => (w === "A" ? "B" : "A");
const START = "2026-10-01"; // tracking starts here: nothing can be logged or planned before it
const sow = (d) => { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; }; // start of week
const minOffset = Math.round((sow(parse(START)) - sow(today)) / 6048e5); // earliest week the Today tab can show
const exsOf = (t, w = data.week) => data.days[t][w];
// data.week is the letter of the week starting data.weekAnchor; other weeks alternate from it.
function weekOf(date) {
  const weeks = Math.round((sow(parse(date)) - sow(parse(data.weekAnchor))) / 6048e5);
  return Math.abs(weeks) % 2 === 0 ? data.week : flip(data.week);
}
const hasSession = (t, w) => exsOf(t, w).length || (data.days[t].note && !isRest(data.days[t].note));
const isRest = (note) => /^rest$/i.test(note.trim());
const noTime = (text) => text.replace(/\s*\b\d{1,2}(:\d{2})?\s*(am|pm)\b/gi, "").trim(); // "Muay Thai Pads 11am" → "Muay Thai Pads"

// Which plans land on a date, as {t: default weekday, w: "A"/"B"}, after moves/deletions in
// Google Calendar. A moved workout keeps the week letter of the day it came from.
// Edit mode always shows the default plan for the selected weekday.
function plansFor(date, forEdit = editing) {
  const wd = parse(date).getDay();
  if (forEdit) return [{ t: wd, w: weekOf(date) }];
  let ps = [{ t: wd, w: weekOf(date) }].filter(({ t }) => !sched.moves.some((m) => m.from === date && m.day === t)
    && !sched.cancels.some((c) => c.date === date && c.day === t));
  for (const m of sched.moves) if (m.to === date) ps.push({ t: m.day, w: weekOf(m.from) });
  // Drop a "Rest" placeholder when a workout was moved onto this day.
  if (ps.length > 1) ps = ps.filter(({ t, w }) => hasSession(t, w));
  return ps;
}

async function loadSchedule() {
  try {
    const s = await (await fetch("/api/schedule", { cache: "no-store" })).json();
    if (s.ok) { sched = s; schedErr = ""; } else schedErr = s.error;
  } catch { schedErr = "couldn't reach server"; }
}

async function load() {
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    data = await r.json();
  } catch {
    data = JSON.parse(localStorage.getItem("gains-brain-cache") || "null");
    toast(data ? "Offline: showing your last loaded copy" : "Can't reach the server");
    if (!data) return;
  }
  data.log = data.log || [];
  data.extras = data.extras || {}; // one-off exercises added for a single date
  data.drafts = data.drafts || {}; // per-date edits to planned cards, until checked off
  data.skips = data.skips || {}; // Muay Thai sessions you unchecked, by date
  data.weekAnchor = data.weekAnchor || iso(sow(today)); // a fresh setup starts with this week
  await loadSchedule();
  localStorage.setItem("gains-brain-cache", JSON.stringify(data));
  render();
}

function save() {
  localStorage.setItem("gains-brain-cache", JSON.stringify(data));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch("/api/data", { method: "PUT", body: JSON.stringify(data) });
      toast(r.ok ? "" : "Not saved: the server had a problem");
    } catch { toast("Not saved: can't reach the server"); }
  }, 500);
}

// Most recent logged entry (by date) for an exercise before a date.
function prevEntry(name, before) {
  let best;
  for (const e of data.log) if (e.name === name && e.weight !== undefined && e.date < before && (!best || e.date >= best.date)) best = e;
  return best;
}

// What a planned card shows on a date: that day's unsaved edits, else the last logged
// numbers before that day, else the default plan's numbers.
function shown(ex, date) {
  const d = data.drafts[date]?.[ex.name];
  if (d) return { name: ex.name, ...d };
  const p = prevEntry(ex.name, date);
  if (!p) return ex;
  const sets = [...p.sets];
  while (sets.length < ex.sets.length) sets.push("");
  return { name: ex.name, weight: p.weight, sets };
}

const detail = (e) => [e.weight, (e.sets || []).filter(Boolean).join(", ")].filter(Boolean).join(" × ");

// Log list for a date: tap the check to undo, plus a box for anything unplanned.
function logSection(date) {
  const entries = logFor(date);
  return `<div class="log">
    ${entries.map((e) => `<div class="card row entry">
      <button class="check on" data-act="unlog" data-k="${data.log.indexOf(e)}" data-date="${e.date}" data-name="${esc(e.name)}" aria-label="Undo">✓</button>
      <div><div class="name">${esc(noTime(e.name))}</div>${detail(e) ? `<div class="sub">${esc(detail(e))}</div>` : ""}</div>
    </div>`).join("") || `<div class="empty">Nothing logged yet.</div>`}
  </div>`;
}

function render() {
  document.body.classList.toggle("editing", editing);
  for (const v of ["plan", "cal", "trends"]) document.body.classList.toggle(v, view === v);
  $("#edit").textContent = editing ? "Done" : "Edit";
  $("#edit").classList.toggle("primary", editing);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
  const startLabel = weekStart().toLocaleDateString(undefined, { month: "short", day: "numeric" });
  $('#weeknav [data-d="1"]').disabled = weekOffset >= 0;
  $('#weeknav [data-d="-1"]').disabled = weekOffset <= minOffset;
  $("#weeklabel").textContent = weekOffset ? `Week of ${startLabel}` : `This week · ${startLabel}`;
  $("#days").innerHTML = DAYS.map((d, i) => {
    const dt = weekStart(); dt.setDate(dt.getDate() + i);
    return `<button data-i="${i}" class="${i === dayIdx ? "on" : ""} ${!weekOffset && i === today.getDay() ? "today" : ""}">${d}<small>${dt.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small></button>`;
  }).join("");
  $("#tip").hidden = true;
  $("#main").innerHTML = view === "cal" ? renderCal() : view === "trends" ? renderTrends() : renderPlan();
}

// Calendar status plus "moved to …" / "removed" notes for a date.
function calNotes(date) {
  const short = { weekday: "short", month: "short", day: "numeric" };
  let html = schedErr ? `<div class="empty">Calendar: ${esc(schedErr)}. Showing your default schedule.</div>` : "";
  for (const m of sched.moves.filter((m) => m.from === date)) html += `<div class="empty">📅 ${esc(m.title)} moved to ${fmt(m.to, short)}</div>`;
  for (const c of sched.cancels.filter((c) => c.date === date)) html += `<div class="empty">📅 ${esc(c.title)} removed from the calendar</div>`;
  return html;
}

// A reps box: a <select>, which iPhone shows as a scroll wheel. 1–50, blank to clear, and any
// other existing value (like 9.5) kept as an option. An empty box places its blank "–" right
// above `hint` (the last logged reps), so the wheel opens one flick away from that number.
const REPS = Array.from({ length: 50 }, (_, k) => String(k + 1));
function repsPicker(value, j, hint) {
  let opts = REPS;
  for (const v of [value, hint]) if (v && !opts.includes(v)) opts = [...opts, v].sort((a, b) => a - b);
  const at = !value && opts.includes(hint) ? opts.indexOf(hint) : 0;
  const html = opts.map((o) => `<option${o === value ? " selected" : ""}>${o}</option>`);
  html.splice(at, 0, `<option value=""${value ? "" : " selected"}>–</option>`);
  return `<select data-f="set" data-j="${j}" aria-label="Reps for set ${j + 1}">${html.join("")}</select>`;
}
// Reps to aim an empty set's wheel at: the same set last time, else the last set logged then,
// else the bottom of the exercise's rep range.
function repsHint(ex, last, j) {
  const sets = (last && last.sets) || [];
  return sets[j] || sets[sets.length - 1] || ((ex.reps || "").match(/^\d+/) || [""])[0];
}

// Weight, reps-per-set and "Last" lines shared by planned and one-off exercise cards.
// `aside` goes at the right end of the "Reps per set" line (used for one-off cards' Remove button).
// Total weight for one rep, from the per-side number: trap bar 2×+55, incline bench press 2×
// (dumbbells), other bench presses 2×+45, Bulgarian split squats 1×+10, pull-ups none
// (bodyweight), everything else 2×+10.
// Blank for non-numbers like "L3".
function totalLb(name, weight) {
  const n = parseFloat(weight);
  if (isNaN(n) || /pull-?ups?/i.test(name)) return null;
  const add = /trap bar/i.test(name) ? 55 : /incline bench press/i.test(name) ? 0 : /bench press/i.test(name) ? 45 : 10;
  const sides = /bulgarian split squat/i.test(name) ? 1 : 2;
  return +(sides * n + add).toFixed(2);
}
const totalText = (name, weight) => { const t = totalLb(name, weight); return t === null ? "" : `Total ${t} lb`; };

function exBody(ex, date, aside = "") {
  const p = ex.name && prevEntry(ex.name, date);
  return `<div class="row" style="margin:12px 0 6px"><div class="label" style="margin:0;flex:1">Weight per side</div>
      <span class="total">${totalText(ex.name, ex.weight)}</span></div>
    <div class="row weight">
      <button class="step" data-step="-2.5">−</button>
      <input data-f="weight" value="${esc(ex.weight)}" inputmode="decimal">
      <button class="step" data-step="2.5">+</button>
    </div>
    <div class="row" style="margin:12px 0 6px"><div class="label" style="margin:0;flex:1">Reps per set</div>${aside}</div>
    <div class="sets">
      ${ex.sets.map((s, j) => repsPicker(s, j, repsHint(ex, p, j))).join("")}
      <button class="addset" data-act="addset">+</button>
    </div>
    ${p ? `<div class="prev">Last (${fmt(p.date, { month: "short", day: "numeric" })}): ${esc(detail(p) || "—")}</div>` : ""}`;
}

function renderPlan() {
  const date = curDate(), ps = plansFor(date);
  const logged = new Set(logFor(date).map((e) => e.name));
  const wk = weekOf(date);
  let html = `<div class="row">
      <div class="date" style="flex:1">${editing ? `Editing your default ${fmt(date, { weekday: "long" })} plan`
        : fmt(date, { month: "short", day: "numeric" })}</div>
      <div class="seg">${["A", "B"].map((w) => `<button data-act="week" data-w="${w}" class="${w === wk ? "on" : ""}">${w}</button>`).join("")}</div>
    </div>`;
  if (!editing && date < START) return html + `<div class="card note row">Before tracking started (Oct 1)</div>`;
  if (!editing) {
    html += calNotes(date);
    if (!ps.length) html += `<div class="card note row">Rest</div>`;
  }

  for (const { t, w } of ps) {
    const day = data.days[t], exs = exsOf(t, w);
    const todo = exs.map((ex, i) => ({ ex, i })).filter(({ ex }) => editing || !logged.has(ex.name));
    if (t !== dayIdx) html += `<div class="section">${DAYS[t]}'s workout${exs.length && w !== weekOf(date) ? ` (Week ${w})` : ""} · moved here in calendar</div>`;
    html += `<div class="card edit-only" data-t="${t}" style="flex-direction:column">
        <div class="label" style="margin-top:0">Day note (e.g. Rest, Muay Thai)</div>
        <input data-f="note" value="${esc(day.note)}" placeholder="Optional"></div>`;
    if (!editing && day.note && !logged.has(day.note)) {
      html += `<div class="card row ${exs.length ? "" : "note"}" data-t="${t}">
        ${!isRest(day.note) ? `<button class="check" data-act="checknote" aria-label="Done">✓</button>` : ""}
        <div style="${exs.length ? "color:var(--muted)" : ""}">${esc(noTime(day.note))}</div></div>`;
    }
    if (!editing && !day.note && !exs.length) html += `<div class="card note row">Rest</div>`;
    if (!editing && exs.length && !todo.length) html += `<div class="empty">All planned exercises done 💪</div>`;

    html += todo.map(({ ex, i }) => {
      return `<div class="card" data-t="${t}" data-w="${w}" data-i="${i}">
        <div class="view-only row">
          <button class="check" data-act="check" aria-label="Done">✓</button>
          <div><span class="name">${esc(ex.name)}</span><span class="reps">${esc(ex.reps)} reps</span></div>
        </div>
        <div class="edit-only row">
          <input data-f="name" value="${esc(ex.name)}" placeholder="Exercise">
          <input data-f="reps" value="${esc(ex.reps)}" placeholder="8-12" style="width:84px;flex:none">
        </div>
        ${exBody(editing ? ex : shown(ex, date), date)}
        <div class="edit-only row tools">
          <button data-act="up">↑</button><button data-act="down">↓</button>
          <button data-act="rmset">− set</button>
          <button class="del" data-act="del">Delete</button>
        </div>
      </div>`;
    }).join("");
  }

  if (editing) html += `<button class="btn" data-act="add" data-t="${dayIdx}" data-w="${weekOf(date)}">+ Exercise</button>`;
  else {
    html += (data.extras[date] || []).map((ex, i) => ex.name && logged.has(ex.name) ? "" : `<div class="card" data-x="${date}" data-i="${i}">
        <div class="row">
          <button class="check" data-act="check" aria-label="Done">✓</button>
          <input data-f="name" value="${esc(ex.name)}" placeholder="Exercise name">
        </div>
        ${exBody(ex, date, `<button class="btn small del" data-act="rmextra">Remove</button>`)}
      </div>`).join("");
    html += `<button class="btn" data-act="addextra">+ Add exercise</button>`;
    html += `<div class="section">Log</div>` + logSection(date);
  }
  return html;
}

function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const counts = {};
  let cells = DAYS.map((d) => `<div class="dow">${d[0]}</div>`).join("");
  cells += "<div></div>".repeat(new Date(y, m, 1).getDay());
  for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) {
    const s = iso(new Date(y, m, d));
    counts[s] = logFor(s).length;
    const planned = s >= START && plansFor(s).some(({ t, w }) => hasSession(t, w));
    const cls = [counts[s] && "has", planned && "plan", s === todayStr && "today", s === calSel && "sel", s > todayStr && "future"].filter(Boolean).join(" ");
    cells += `<button class="${cls}" data-act="cal" data-date="${s}">${d}</button>`;
  }
  return `<div class="card">
      <div class="row" style="margin-bottom:10px">
        <button class="btn" data-act="month" data-d="-1" aria-label="Previous month" ${iso(calMonth) <= START ? "disabled" : ""}>‹</button>
        <div class="month">${calMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</div>
        <button class="btn" data-act="month" data-d="1" aria-label="Next month">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="cal-side">
    <div class="date">${fmt(calSel, { weekday: "long", month: "short", day: "numeric", year: "numeric" })}</div>
    ${calNotes(calSel)}
    ${plannedSection(calSel)}
    <div class="section">Log</div>
    ${logSection(calSel)}
    </div>`;
}

function plannedSection(date) {
  const wd = parse(date).getDay();
  const rows = plansFor(date).filter(({ t, w }) => hasSession(t, w)).map(({ t, w }) => {
    const exs = exsOf(t, w);
    return `<div>
      <div class="name">${exs.length ? `Lifting · Week ${w}` : esc(noTime(data.days[t].note))}${t !== wd ? `<span class="reps">${DAYS[t]}'s, moved here</span>` : ""}</div>
      ${exs.length ? `<div class="sub">${esc(exs.map((e) => e.name).join(" · "))}</div>` : ""}
    </div>`;
  }).join("");
  return `<div class="section">Planned</div>
    <div class="card" style="display:grid;gap:10px">${rows || `<div class="empty">Rest</div>`}</div>`;
}

// ---- Trends ----
// Each exercise is charted by one measure, picked above the charts. All use the total weight
// (see totalLb): Weight is that total, Est. 1RM is total × (1 + best-set reps / 30), and
// Volume is total × all reps.
// Exercises with no total (pull-ups, "L3") fall back to best-set reps.
const METRICS = { weight: "Weight", volume: "Volume", e1rm: "Est. 1RM" };
// Main muscle worked, matched on the exercise name in this order (so "Wide Grip Seated Row" is Back,
// not Forearms). Anything unmatched goes under Other.
const MUSCLES = [
  ["Chest", /push-?ups?|bench press|\bdips?\b|chest|fl(y|ies)\b/i],
  ["Back", /pull-?ups?|chin-?ups?|pulldown|\brows?\b/i],
  ["Shoulders", /lateral raise|shoulder|overhead press|face pull|rear delt/i],
  ["Legs", /squat|deadlift|\bdl\b|\brdl\b|lunge|swing|calf|hip thrust|\bleg\b/i],
  ["Forearms", /wrist|forearm|grip/i],
];
const muscleOf = (name) => (MUSCLES.find(([, re]) => re.test(name)) || ["Other"])[0];
const LABELS = { ...METRICS, weight: "Total", reps: "Best set" }; // session table column headings
let trendMetric = "weight", charts = []; // charts: hover data for each rendered chart, by data-c
const shortDate = (s) => fmt(s, { month: "short", day: "numeric" });
const bestSet = (e) => Math.max(0, ...(e.sets || []).map(parseFloat).filter((n) => !isNaN(n)));
function metricOf(e, m) {
  const r = bestSet(e);
  if (m === "reps") return r || null;
  const t = totalLb(e.name, e.weight);
  if (m === "weight") return t || null;
  if (m === "volume") {
    const reps = (e.sets || []).map(parseFloat).filter((n) => !isNaN(n)).reduce((a, b) => a + b, 0);
    return t && reps ? Math.round(t * reps) : null;
  }
  return t && r ? Math.round(t * (1 + r / 30)) : null;
}
const fmtMetric = (v, m) => m === "reps" ? `${v} reps` : `${v.toLocaleString()} lb`;

// Round axis bounds and ticks; never below 0.
function niceTicks(min, max, n = 4) {
  if (min === max) { const pad = Math.abs(min) * 0.1 || 1; min -= pad; max += pad; }
  const raw = (max - min) / (n - 1), mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => s >= raw);
  const lo = Math.max(0, Math.floor(min / step) * step), hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(2));
  return [lo, hi, ticks];
}

// Width available to a chart inside a card, so SVG text renders at its real size.
function chartWidth(minCard) {
  const m = $("#main"), st = getComputedStyle(m);
  const w = m.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight), gap = parseFloat(st.columnGap) || 12;
  const cols = minCard && matchMedia("(min-width: 900px)").matches ? Math.max(1, Math.floor((w + gap) / (minCard + gap))) : 1;
  return Math.floor((w - gap * (cols - 1)) / cols - 30); // 30 = card padding + border
}

// One series over time: 2px line, ringed dots, the latest value labeled at the end.
function lineChart(pts, W) {
  const H = 150, L = 38, R = 10, T = 22, B = 22, pw = W - L - R, ph = H - T - B;
  const t0 = parse(pts[0].date), span = parse(pts.at(-1).date) - t0;
  const X = (d) => L + (span ? (parse(d) - t0) / span * pw : pw / 2);
  const [lo, hi, ticks] = niceTicks(Math.min(...pts.map((p) => p.v)), Math.max(...pts.map((p) => p.v)), 3);
  const Y = (v) => T + ph - (v - lo) / (hi - lo) * ph;
  const xy = pts.map((p) => ({ x: X(p.date), y: Y(p.v), tip: p.tip }));
  const last = xy.at(-1);
  charts.push({ kind: "line", pts: xy, top: T, bottom: T + ph });
  return `<svg class="chart" data-c="${charts.length - 1}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(pts.map((p) => `${shortDate(p.date)}: ${p.v}`).join(", "))}">
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
    <g class="hl"></g>
    ${xy.length > 1 ? `<path class="line" d="M${xy.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join("L")}"/>` : ""}
    ${xy.map((p) => `<circle class="dot" cx="${p.x}" cy="${p.y}" r="4"/>`).join("")}
    <text class="end" x="${last.x + 4}" y="${last.y - 10}" text-anchor="end">${pts.at(-1).v}</text>
    <text x="${L}" y="${H - 4}">${shortDate(pts[0].date)}</text>
    ${span ? `<text x="${W - R}" y="${H - 4}" text-anchor="end">${shortDate(pts.at(-1).date)}</text>` : ""}
  </svg>`;
}

// Sessions per week, lifting days with Muay Thai stacked on top.
function weeklyChart(weeks, W) {
  const H = 170, L = 26, R = 4, T = 10, B = 22, pw = W - L - R, ph = H - T - B, base = T + ph;
  const max = Math.max(1, ...weeks.map((w) => w.lift + w.mt)), step = Math.ceil(max / 4), hi = Math.ceil(max / step) * step;
  const Y = (v) => base - v / hi * ph, slot = pw / weeks.length, bw = Math.min(24, slot * 0.6);
  const every = Math.ceil(52 / slot); // label every nth week so labels don't touch
  // A column segment; only the top one gets 4px rounded corners.
  const seg = (x, y, h, round) => { const r = round ? Math.min(4, h, bw / 2) : 0;
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${y + h}Z`; };
  let bars = "", labels = "";
  const pts = weeks.map((w, i) => {
    const cx = L + slot * (i + 0.5), x = cx - bw / 2, h1 = w.lift / hi * ph, h2 = w.mt / hi * ph;
    if (h1) bars += `<path d="${seg(x, base - h1, h1, !h2)}" fill="var(--s1)"/>`;
    if (h2) bars += `<path d="${seg(x, base - h1 - h2, h2 - (h1 ? 2 : 0), true)}" fill="var(--s2)"/>`; // 2px gap between segments
    if (i % every === 0) labels += `<text x="${cx}" y="${H - 4}" text-anchor="middle">${shortDate(w.start)}</text>`;
    return { x: cx, tip: `Week of ${shortDate(w.start)}<br>Lifting: ${w.lift} · Muay Thai: ${w.mt}` };
  });
  charts.push({ kind: "bar", pts, slot, top: T, bottom: base });
  const ticks = []; for (let v = 0; v <= hi; v += step) ticks.push(v);
  return `<svg class="chart" data-c="${charts.length - 1}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions per week">
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
    <g class="hl"></g>${bars}${labels}
  </svg>`;
}

function renderTrends() {
  charts = [];
  const lifts = data.log.filter((e) => e.weight !== undefined).sort((a, b) => a.date.localeCompare(b.date));
  // Every day from the start of tracking, with Muay Thai counted the same way the log does.
  const weeks = [];
  for (const d = sow(parse(START)); iso(d) <= todayStr; d.setDate(d.getDate() + 1)) {
    const s = iso(d);
    if (d.getDay() === 0) weeks.push({ start: s, lift: 0, mt: 0 });
    if (s < START || s > todayStr) continue;
    const w = weeks.at(-1), entries = logFor(s);
    if (entries.some((e) => e.weight !== undefined)) w.lift++;
    w.mt += entries.filter((e) => isAuto(e.name)).length;
  }
  const liftDays = weeks.reduce((n, w) => n + w.lift, 0), mt = weeks.reduce((n, w) => n + w.mt, 0);
  const sets = lifts.reduce((n, e) => n + e.sets.filter(Boolean).length, 0);

  // Sessions per exercise, one per date (the last logged that day wins).
  const byName = {};
  for (const e of lifts) (byName[e.name] = byName[e.name] || {})[e.date] = e;
  let bests = 0;
  const exercises = Object.entries(byName).map(([name, days]) => {
    const sessions = Object.values(days);
    let m = trendMetric, fallback = false;
    if (sessions.every((s) => metricOf(s, m) === null)) { m = "reps"; fallback = true; }
    const pts = sessions.filter((s) => metricOf(s, m) !== null).map((s) => ({ date: s.date, v: metricOf(s, m),
      tip: `${shortDate(s.date)}: ${esc(fmtMetric(metricOf(s, m), m))}<br>${esc(detail(s))}` }));
    // New bests: sessions that beat every earlier one on Est. 1RM (or reps without a weight).
    let top = -1;
    sessions.forEach((s, i) => { const v = metricOf(s, "e1rm") ?? metricOf(s, "reps") ?? 0; if (i && v > top) bests++; top = Math.max(top, v); });
    return { name, sessions, pts, m, fallback, last: sessions.at(-1).date };
  }).sort((a, b) => b.last.localeCompare(a.last) || a.name.localeCompare(b.name));

  const tile = (label, val) => `<div class="card tile"><div class="sub">${label}</div><div class="val">${val}</div></div>`;
  let html = `<div class="row"><div class="date" style="flex:1">Since ${fmt(START, { month: "short", day: "numeric", year: "numeric" })}</div></div>
    <div class="tiles">${tile("Lifting days", liftDays)}${tile("Muay Thai sessions", mt)}${tile("Sets logged", sets)}${tile("New bests", bests)}</div>
    <div class="card wide">
      <div class="row"><div class="name" style="flex:1">Sessions per week</div>
        <div class="legend"><span><i style="background:var(--s1)"></i>Lifting</span><span><i style="background:var(--s2)"></i>Muay Thai</span></div></div>
      ${weeklyChart(weeks, chartWidth())}
      <details><summary>Table</summary><table><tr><th>Week of</th><th>Lifting days</th><th>Muay Thai</th></tr>
        ${weeks.map((w) => `<tr><td>${shortDate(w.start)}</td><td>${w.lift}</td><td>${w.mt}</td></tr>`).join("")}</table></details>
    </div>
    <div class="row"><div class="section" style="flex:1;margin:0">Exercises</div>
      <div class="seg">${Object.entries(METRICS).map(([k, v]) => `<button data-act="metric" data-m="${k}" class="${k === trendMetric ? "on" : ""}">${v}</button>`).join("")}</div></div>`;
  if (!exercises.length) return html + `<div class="empty">Check off some exercises and their history shows up here.</div>`;

  const W = chartWidth(340);
  const groups = [...MUSCLES.map(([g]) => g), "Other"].map((g) => [g, exercises.filter((x) => muscleOf(x.name) === g)]);
  for (const [g, xs] of groups) if (xs.length) html += `<div class="group">${g}</div>` + xs.map((x) => {
    const first = x.pts[0], last = x.pts.at(-1), diff = +(last.v - first.v).toFixed(2);
    const delta = x.pts.length > 1 ? `<span class="delta ${diff > 0 ? "up" : ""}">${diff > 0 ? "▲ +" : diff < 0 ? "▼ " : ""}${diff ? fmtMetric(diff, x.m) : "No change"}</span>` : "";
    return `<div class="card">
      <div class="row"><div class="name" style="flex:1">${esc(x.name)}</div>${delta}</div>
      <div class="sub">${x.fallback ? "Best set (bodyweight) · " : ""}${x.sessions.length} session${x.sessions.length > 1 ? "s" : ""}${x.pts.length > 1 ? ` · since ${shortDate(first.date)}` : ""}</div>
      ${lineChart(x.pts, W)}
      <details><summary>Sessions</summary><table><tr><th>Date</th><th>Per side</th><th>Reps</th><th>${LABELS[x.m]}</th></tr>
        ${x.sessions.slice().reverse().map((s) => `<tr><td>${shortDate(s.date)}</td><td>${esc(s.weight)}</td><td>${esc(s.sets.filter(Boolean).join(", "))}</td><td>${metricOf(s, x.m) ?? "–"}</td></tr>`).join("")}</table></details>
    </div>`;
  }).join("");
  return html;
}

// Chart hover (and tap): nearest point gets a crosshair or column highlight plus a tooltip.
function chartHover(e) {
  const svg = e.target.closest?.("svg[data-c]"), tip = $("#tip");
  document.querySelectorAll(".chart .hl").forEach((g) => (g.innerHTML = ""));
  if (!svg) return (tip.hidden = true);
  const c = charts[+svg.dataset.c], p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const pt = c.pts.reduce((a, b) => (Math.abs(b.x - p.x) < Math.abs(a.x - p.x) ? b : a));
  svg.querySelector(".hl").innerHTML = c.kind === "bar"
    ? `<rect x="${pt.x - c.slot / 2}" y="${c.top}" width="${c.slot}" height="${c.bottom - c.top}" rx="4"/>`
    : `<line x1="${pt.x}" x2="${pt.x}" y1="${c.top}" y2="${c.bottom}"/>`;
  tip.innerHTML = pt.tip;
  tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY + 14) + "px";
}
$("#main").addEventListener("pointermove", chartHover);
$("#main").addEventListener("pointerdown", chartHover);
$("#main").addEventListener("pointerleave", chartHover);
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => view === "trends" && render(), 150); });

const listOf = (card) => card.dataset.x ? data.extras[card.dataset.x] : exsOf(+card.dataset.t, card.dataset.w);
function valuesFor(card) {
  const ex = listOf(card)[+card.dataset.i];
  if (card.dataset.x || editing) return ex;
  const date = curDate(), drafts = (data.drafts[date] = data.drafts[date] || {});
  if (!drafts[ex.name]) { const v = shown(ex, date); drafts[ex.name] = { weight: v.weight, sets: [...v.sets] }; }
  return drafts[ex.name];
}
function clearDraft(date, name) {
  if (!data.drafts[date]) return;
  delete data.drafts[date][name];
  if (!Object.keys(data.drafts[date]).length) delete data.drafts[date];
}

// Typing: update data in place without re-rendering, so the keyboard stays open.
function onEdit(e) {
  const f = e.target.dataset.f;
  if (!f) return;
  const card = e.target.closest(".card");
  if (f === "note") { data.days[+card.dataset.t].note = e.target.value; return save(); }
  if (f === "name" || f === "reps") listOf(card)[+card.dataset.i][f] = e.target.value;
  else if (f === "set") valuesFor(card).sets[+e.target.dataset.j] = e.target.value;
  else valuesFor(card)[f] = e.target.value;
  if (f === "weight" || f === "name") updateTotal(card);
  save();
}
function updateTotal(card) {
  const el = card.querySelector(".total");
  if (el) el.textContent = totalText(listOf(card)[+card.dataset.i].name, card.querySelector("input[data-f=weight]").value);
}
$("#main").addEventListener("input", onEdit);
$("#main").addEventListener("change", (e) => { if (e.target.tagName === "SELECT") onEdit(e); });

// Naming a one-off exercise you've logged before fills in its last weight and reps, if still blank.
$("#main").addEventListener("change", (e) => {
  const card = e.target.closest(".card[data-x]");
  if (!card || e.target.dataset.f !== "name") return;
  const ex = listOf(card)[+card.dataset.i], p = prevEntry(ex.name.trim(), card.dataset.x);
  if (!p || ex.weight || ex.sets.some(Boolean)) return;
  ex.weight = p.weight;
  ex.sets = [...p.sets];
  while (ex.sets.length < 2) ex.sets.push("");
  save(); render();
});

$("#main").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "unlog") {
    const { date, name } = b.dataset;
    if (isAuto(name)) (data.skips[date] = data.skips[date] || []).push(name); // stays unchecked
    if (+b.dataset.k < 0) { save(); return render(); } // automatic entry, nothing to remove
    const [e] = data.log.splice(+b.dataset.k, 1);
    if (e.weight !== undefined) (data.drafts[e.date] = data.drafts[e.date] || {})[e.name] = { weight: e.weight, sets: [...e.sets, ...(e.sets.length < 2 ? ["", ""].slice(e.sets.length) : [])] };
    save(); return render();
  }
  if (act === "cal") { calSel = b.dataset.date; return render(); }
  if (act === "metric") { trendMetric = b.dataset.m; return render(); }
  if (act === "week") { data.week = b.dataset.w; data.weekAnchor = iso(weekStart()); save(); return render(); }
  if (act === "month") {
    const next = new Date(calMonth.getFullYear(), calMonth.getMonth() + +b.dataset.d, 1);
    if (iso(next) >= START.slice(0, 8) + "01") calMonth = next; // not before the start month
    return render();
  }
  if (act === "checknote") {
    const date = curDate(), name = data.days[+b.closest("[data-t]").dataset.t].note;
    if (skipped(date, name)) data.skips[date] = data.skips[date].filter((n) => n !== name); // re-check
    else data.log.push({ date, name });
    save(); return render();
  }
  if (act === "add") {
    exsOf(+b.dataset.t, b.dataset.w).push({ name: "", reps: "8-12", weight: "0", sets: ["", ""] });
    save(); render();
    return [...document.querySelectorAll("#main input[data-f=name]")].pop().focus();
  }

  if (act === "addextra") {
    const date = curDate();
    (data.extras[date] = data.extras[date] || []).push({ name: "", weight: "", sets: ["", ""] });
    save(); render();
    return [...document.querySelectorAll(`.card[data-x="${date}"] input[data-f=name]`)].pop().focus();
  }

  const card = b.closest(".card[data-i]");
  if (!card) return;
  const w = card.dataset.w, i = +card.dataset.i, exs = listOf(card), ex = exs[i];
  if (b.dataset.step) {
    // Adjust the leading number, keep any suffix like "paused".
    const v = valuesFor(card), m = v.weight.match(/^\s*(-?\d*\.?\d+)(.*)$/);
    const n = Math.max(0, (m ? +m[1] : 0) + +b.dataset.step);
    v.weight = String(+n.toFixed(2)) + (m ? m[2] : "");
    b.parentElement.querySelector("input").value = v.weight;
    updateTotal(card);
    return save();
  }
  if (act === "check") {
    if (!ex.name.trim()) return card.querySelector("input[data-f=name]").focus(); // one-off needs a name first
    // Snapshot what was actually done; later plan edits don't change the log.
    const v = card.dataset.x ? ex : shown(ex, curDate());
    data.log.push({ date: curDate(), week: w, name: ex.name.trim(), weight: v.weight, sets: v.sets.filter(Boolean) });
    clearDraft(curDate(), ex.name);
  }
  if (act === "rmextra" && (!ex.name || confirm(`Remove ${ex.name}?`))) exs.splice(i, 1);
  if (act === "addset") valuesFor(card).sets.push("");
  if (act === "rmset" && ex.sets.length) ex.sets.pop();
  if (act === "del" && confirm(`Delete ${ex.name || "this exercise"}?`)) exs.splice(i, 1);
  if (act === "up" && i > 0) [exs[i - 1], exs[i]] = [exs[i], exs[i - 1]];
  if (act === "down" && i < exs.length - 1) [exs[i + 1], exs[i]] = [exs[i], exs[i + 1]];
  save(); render();
  const sel = card.dataset.x ? `[data-x="${card.dataset.x}"]` : `[data-t="${card.dataset.t}"][data-w="${w}"]`;
  if (act === "addset") document.querySelector(`.card${sel}[data-i="${i}"] .sets select:last-of-type`)?.focus();
});

$("#weeknav").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  // No future weeks or weeks before tracking started; the label jumps back to this week.
  weekOffset = b.dataset.d ? Math.max(minOffset, Math.min(0, weekOffset + +b.dataset.d)) : 0;
  render(); $("#main").scrollTo(0, 0);
});
$("#days").addEventListener("click", (e) => {
  if (e.target.dataset.i == null) return;
  dayIdx = +e.target.dataset.i; render(); $("#main").scrollTo(0, 0);
});
$("#edit").addEventListener("click", () => { editing = !editing; render(); });
// ↻ spins while checking, then shows ✓ (or ! if the calendar couldn't be read) for a moment.
$("#refresh").addEventListener("click", async () => {
  const b = $("#refresh"), icon = b.firstElementChild;
  if (b.classList.contains("spin")) return;
  b.classList.add("spin");
  await loadSchedule();
  b.classList.remove("spin");
  icon.textContent = schedErr ? "!" : "✓";
  render();
  setTimeout(() => (icon.textContent = "↻"), 1500);
});
// Light by default; the choice is remembered in this browser (read in <head> before first paint).
const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function showTheme() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("#theme").innerHTML = dark ? SUN : MOON;
  $("#theme").setAttribute("aria-label", dark ? "Light mode" : "Dark mode");
  $("#theme-color").content = dark ? "#121212" : "#f4f4f1";
}
$("#theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("gains-brain-theme", next); } catch {}
  showTheme();
});
showTheme();
$("#tabs").addEventListener("click", (e) => {
  if (!e.target.dataset.v) return;
  view = e.target.dataset.v; editing = false; render(); $("#main").scrollTo(0, 0);
});

load();
</script>
</body>
