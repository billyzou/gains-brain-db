  <g fill="#b8487a"><circle cx="194.0" cy="226.0" r="42"/><circle cx="227.5" cy="240.6" r="42"/><circle cx="250.4" cy="279.8" r="42"/><circle cx="255.4" cy="331.1" r="42"/><circle cx="240.9" cy="378.2" r="42"/><circle cx="211.5" cy="406.3" r="42"/><circle cx="176.5" cy="406.3" r="42"/><circle cx="147.1" cy="378.2" r="42"/><circle cx="132.6" cy="331.1" r="42"/><circle cx="137.6" cy="279.8" r="42"/><circle cx="160.5" cy="240.6" r="42"/><circle cx="318.0" cy="226.0" r="42"/><circle cx="351.5" cy="240.6" r="42"/><circle cx="374.4" cy="279.8" r="42"/><circle cx="379.4" cy="331.1" r="42"/><circle cx="364.9" cy="378.2" r="42"/><circle cx="335.5" cy="406.3" r="42"/><circle cx="300.5" cy="406.3" r="42"/><circle cx="271.1" cy="378.2" r="42"/><circle cx="256.6" cy="331.1" r="42"/><circle cx="261.6" cy="279.8" r="42"/><circle cx="284.5" cy="240.6" r="42"/></g>
  <g fill="#f7a8c4"><circle cx="194.0" cy="226.0" r="30"/><circle cx="227.5" cy="240.6" r="30"/><circle cx="250.4" cy="279.8" r="30"/><circle cx="255.4" cy="331.1" r="30"/><circle cx="240.9" cy="378.2" r="30"/><circle cx="211.5" cy="406.3" r="30"/><circle cx="176.5" cy="406.3" r="30"/><circle cx="147.1" cy="378.2" r="30"/><circle cx="132.6" cy="331.1" r="30"/><circle cx="137.6" cy="279.8" r="30"/><circle cx="160.5" cy="240.6" r="30"/><circle cx="318.0" cy="226.0" r="30"/><circle cx="351.5" cy="240.6" r="30"/><circle cx="374.4" cy="279.8" r="30"/><circle cx="379.4" cy="331.1" r="30"/><circle cx="364.9" cy="378.2" r="30"/><circle cx="335.5" cy="406.3" r="30"/><circle cx="300.5" cy="406.3" r="30"/><circle cx="271.1" cy="378.2" r="30"/><circle cx="256.6" cy="331.1" r="30"/><circle cx="261.6" cy="279.8" r="30"/><circle cx="284.5" cy="240.6" r="30"/><ellipse cx="194" cy="318" rx="66" ry="96"/><ellipse cx="318" cy="318" rx="66" ry="96"/></g>

