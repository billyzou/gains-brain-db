  <!-- folds -->
  <g fill="none" stroke="#b8487a" stroke-width="9" stroke-linecap="round">
    <path d="M214 236 Q196 252 212 272 Q228 292 206 306"/><path d="M160 262 Q180 270 174 292"/><path d="M140 318 Q162 310 170 330 Q178 350 160 362"/><path d="M150 398 Q172 386 186 404"/><path d="M196 434 Q208 416 226 424"/>
