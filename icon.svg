<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#2f6fde"/>

  <!-- arms: from the brain's sides up to the bar -->
  <g fill="none" stroke="#b8487a" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M136 330 Q82 300 104 228 Q118 188 160 150"/>
    <path d="M376 330 Q430 300 408 228 Q394 188 352 150"/>
  </g>
  <g fill="none" stroke="#f7a8c4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M136 330 Q82 300 104 228 Q118 188 160 150"/>
    <path d="M376 330 Q430 300 408 228 Q394 188 352 150"/>
  </g>

  <!-- dumbbell overhead -->
  <g fill="#fff">
    <rect x="110" y="126" width="292" height="22" rx="8"/>
    <rect x="70" y="86" width="40" height="102" rx="12"/>
    <rect x="40" y="104" width="30" height="66" rx="10"/>
    <rect x="402" y="86" width="40" height="102" rx="12"/>
    <rect x="442" y="104" width="30" height="66" rx="10"/>
  </g>
  <!-- hands gripping the bar -->
